plugins {
    id 'com.android.application'
}

android {
    namespace 'br.tvlauncher.home'
    compileSdk 34

    defaultConfig {
        applicationId "br.tvlauncher.home"
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
